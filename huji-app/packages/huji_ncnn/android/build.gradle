group = "com.hhuoao.huji_ncnn"
version = "1.0"

// No buildscript block: Flutter plugins inherit the app's Android Gradle
// Plugin — declaring our own classpath here conflicts with the host project.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace "com.hhuoao.huji_ncnn"
    compileSdk 34

    // Pin explicitly: library modules don't inherit the app's
    // flutter.ndkVersion — AGP silently falls back to its own default NDK,
    // which may not be installed (CI failed configuring this project with
    // "NDK not configured. Preferred NDK version is '27.0.12077973'").
    // Keep in sync with the sdkmanager install in release.yml.
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // ABI filters come from the app's build (--target-platform). The ncnn
    // android-vulkan prebuilts cover armeabi-v7a / arm64-v8a / x86 / x86_64.

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1+"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
