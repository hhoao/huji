group = "com.hhuoao.huji_ncnn"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.3.0"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace "com.hhuoao.huji_ncnn"
    compileSdk 34

    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti -fopenmp"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            // ncnn android-vulkan prebuilts cover these ABIs.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1+"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
