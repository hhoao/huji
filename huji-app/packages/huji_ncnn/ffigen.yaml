# ffigen config — generates Dart bindings for the huji_ncnn C shim.
# Regenerate: dart run ffigen --config ffigen.yaml
name: HujiNcnnNative
description: Bindings for the huji_ncnn C shim (ncnn inference).
output: lib/src/bindings.g.dart
headers:
  entry-points:
    - src/huji_ncnn_api.h
compiler-opts:
  - '-Isrc'
