name: huji_ncnn
description: >
  ncnn (Vulkan) inference bindings for huji — thin C shim over ncnn::Net
  exposed via dart:ffi. Loads YOLO classify models (.param/.bin) and runs
  single-frame classification on CPU or any Vulkan-capable GPU.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^11.0.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  # FFI-only plugin: no method channel class, native lib resolved by name.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
