name: Build AppImage

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        arch: [x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libmpv-dev mpv curl

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: huji-app

      - name: Build Flutter Linux release
        run: flutter build linux --release
        working-directory: huji-app

      - name: Build AppImage
        run: bash scripts/build_appimage.sh
        working-directory: huji-app

      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: huji-app/build/appimage/*.AppImage
