name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            flutter_target: linux-x64
            qemu_arch: ''
          - arch: aarch64
            flutter_target: linux-arm64
            qemu_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU (aarch64 only)
        if: matrix.qemu_arch != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_arch }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libjsoncpp-dev libstdc++-12-dev \
            file fuse libfuse2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Build AppImage (native ${{ matrix.arch }})
        if: matrix.qemu_arch == ''
        working-directory: huji-app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          flutter config --enable-linux-desktop
          ./scripts/build_appimage.sh

      - name: Build AppImage (cross ${{ matrix.arch }} via Docker+QEMU)
        if: matrix.qemu_arch != ''
        run: |
          docker run --rm --platform linux/${{ matrix.qemu_arch }} \
            -v "${{ github.workspace }}":/workspace -w /workspace/huji-app \
            ubuntu:22.04 bash -c '
              set -e
              apt-get update
              apt-get install -y clang cmake ninja-build pkg-config \
                libgtk-3-dev liblzma-dev libsecret-1-dev \
                libjsoncpp-dev libstdc++-12-dev \
                file fuse libfuse2 curl unzip xz-utils git ca-certificates
              # Install Flutter inside the container
              git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
              git config --global --add safe.directory /opt/flutter
              git config --global --add safe.directory /workspace
              export PATH="/opt/flutter/bin:$PATH"
              flutter config --enable-linux-desktop
              flutter pub get
              ARCH=${{ matrix.arch }} ./scripts/build_appimage.sh
            '

      - name: Get version
        id: version
        working-directory: huji-app
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huji-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            huji-app/build/appimage/huji-*-${{ matrix.arch }}.AppImage
            huji-app/build/appimage/huji-*-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            huji-app/build/appimage/huji-*-${{ matrix.arch }}.AppImage
            huji-app/build/appimage/huji-*-${{ matrix.arch }}.AppImage.zsync
          fail_on_unmatched_files: true
